name: Fixed Clean Win11 Env
on: [push]

jobs:
  clean-env:
    runs-on: windows-latest
    steps:
      - name: 移除github自带的多余path（似乎没有发现其他的更好的清理方法）
        run: |
          # 白名单
          $desiredPaths = @(
              "C:\Windows\system32",
              "C:\Windows",
              "C:\Windows\System32\Wbem",
              "C:\Windows\System32\WindowsPowerShell\v1.0\",
              "C:\Windows\System32\OpenSSH\",
              "C:\Users\runneradmin\AppData\Local\Microsoft\WindowsApps",
              "C:\ProgramData\Chocolatey\bin",
              "C:\ProgramData\chocolatey\lib\pulumi\tools\Pulumi\bin",
              "C:\Program Files\Git\bin"
          )
          
          # 只有在白名单里的才会被保留
          $cleanedPath = ($env:PATH -split ';' | Where-Object { 
              $_ -and $desiredPaths -contains $_.Trim() 
          }) -join ';'
          
          # 立即更新当前会话的PATH（彻底生效）
          $env:PATH = $cleanedPath
          
          Write-Host "✅ 清理后的PATH："
          $env:PATH -split ';' | ForEach-Object { Write-Host "  $_" }


      - name: 安装 ninja
        run: choco install ninja


      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qt5compat'
          # 一定要按照qt本版本自带的编译器tools_mingw1310中的gcc.exe
          tools: 'tools_mingw1310 tools_ninja tools_cmake'

      - name: 下载项目代码
        uses: actions/checkout@v4


      - name: 编译
        run: |
          cmake -B ./build -DCMAKE_BUILD_TYPE=Debug -G Ninja
          cmake --build ./build