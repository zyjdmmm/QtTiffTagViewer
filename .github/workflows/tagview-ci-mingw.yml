name: TagView-CI-MinGW
 
on: [push]

env:
  QT_VERSION: 6.5.3

jobs:
  build:
    name: "Build"
    runs-on: windows-latest

    steps:
      - name: Install ninja (windows)
        run: choco install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{env.QT_VERSION}}
          arch: win64_mingw


#----------------------------------------------------------#
      - name: 打印用户环境变量PATH
        run: | 
          Write-Host "`n=== User PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "User") -split ';' | ForEach-Object { Write-Host $_ }

      - name: 打印系统环境变量PATH
        run: |
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' | ForEach-Object { Write-Host $_ }
#----------------------------------------------------------#    


      - name: Checkout source code
        uses: actions/checkout@v3
 
      - name: Build
        run: |
          cmake -S . -B build_dir -G "Ninja Multi-Config"
          cmake --build build_dir --config Release