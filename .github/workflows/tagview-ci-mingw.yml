name: TagView-CI-MinGW
 
on: [push]

env:
  QT_VERSION: 6.8.3

jobs:
  build:
    name: "Build"
    runs-on: windows-latest

    steps:
      - name: Install ninja (windows)
        run: choco install ninja

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{env.QT_VERSION}}
          arch: win64_mingw
          # 核心优化1：开启缓存（关键！后续运行直接用缓存）
          cache: true
          # 可选：跳过文档/示例下载（进一步减少体积）
          documentation: false
          examples: false

#--------------------------------------------------------#
      - name: 打印用户环境变量PATH
        run: | 
          Write-Host "`n=== User PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "User") -split ';' | ForEach-Object { Write-Host $_ }

      - name: 打印系统环境变量PATH
        run: |
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' | ForEach-Object { Write-Host $_ }
#--------------------------------------------------------#

      # 核心：通过 GITHUB_ENV 持久化添加 Qt bin 到 PATH
      - name: 持久化添加 Qt bin 目录到环境变量 PATH
        run: |
          # 直接指定固定的 Qt bin 路径（替换原本的动态拼接）
          $qtBinPath = "D:\a\QtTiffTagViewer\Qt\6.8.3\mingw_64\bin"
          Write-Host "即将添加 Qt bin 目录到 PATH: $qtBinPath"
          
          # 关键：向 GITHUB_ENV 写入 PATH，覆盖并保留原有 PATH
          # Windows PowerShell 写法（避免编码问题）
          echo "PATH=$qtBinPath;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                
#--------------------------------------------------------#
      - name: 打印用户环境变量PATH2
        run: | 
          Write-Host "`n=== User PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "User") -split ';' | ForEach-Object { Write-Host $_ }

      - name: 打印系统环境变量PATH2
        run: |
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' | ForEach-Object { Write-Host $_ }
#--------------------------------------------------------#

      - name: 下载源代码
        uses: actions/checkout@v3
 
      - name: 编译
        run: |
          cmake -S . -B build_dir -G "Ninja Multi-Config"
          cmake --build build_dir --config Release