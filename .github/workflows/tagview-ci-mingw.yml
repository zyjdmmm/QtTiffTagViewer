name: TagView-CI-MinGW
 
on: [push]

env:
  QT_VERSION: 6.8.3

jobs:
  build:
    name: "Build"
    runs-on: windows-latest

    steps:
      - name: 安装 ninja (windows)
        run: choco install ninja

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{env.QT_VERSION}}
          arch: win64_mingw
          # 核心优化1：开启缓存（关键！后续运行直接用缓存）
          cache: true
          # 可选：跳过文档/示例下载（进一步减少体积）
          documentation: false
          examples: false

#--------------------------------------------------------#
      - name: 打印用户环境变量PATH
        run: | 
          Write-Host "`n=== User PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "User") -split ';' | ForEach-Object { Write-Host $_ }

      - name: 打印系统环境变量PATH
        run: |
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' | ForEach-Object { Write-Host $_ }
#--------------------------------------------------------#

      - name: 持久化添加 Qt bin 目录到环境变量 PATH
        shell: pwsh
        run: |
          # 固定的 Qt bin 路径
          $qtBinPath = "D:\a\QtTiffTagViewer\Qt\6.8.3\mingw_64\bin"
          Write-Host "准备添加 Qt bin 目录到 PATH: $qtBinPath"

          # 方式1：正确的 GITHUB_ENV 写入方式（推荐）
          # 使用PowerShell的Write-Output避免编码和换行问题
          # Write-Output "PATH=$qtBinPath;$env:PATH" >> $env:GITHUB_ENV

          # 方式2：备选方案（如果方式1仍有问题）
          $newPath = "$qtBinPath;$env:PATH"
          [Environment]::SetEnvironmentVariable("PATH", $newPath, "Process")
          Write-Output "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII -Append

      - name: 验证 Qt bin 目录是否添加到 PATH
        shell: pwsh
        run: |
          # 打印完整的 PATH 环境变量
          Write-Host "当前完整 PATH: $env:PATH"
          
          # 检查 Qt bin 路径是否存在于 PATH 中
          if ($env:PATH -like "*6.8.3\mingw_64\bin*") {
            Write-Host "✅ Qt bin 目录已成功添加到 PATH"
          } else {
            Write-Host "❌ Qt bin 目录未添加到 PATH"
            exit 1 # 验证失败则终止工作流
          }
                
#--------------------------------------------------------#
      - name: 打印用户环境变量PATH2
        run: | 
          Write-Host "`n=== User PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "User") -split ';' | ForEach-Object { Write-Host $_ }

      - name: 打印系统环境变量PATH2
        run: |
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' | ForEach-Object { Write-Host $_ }
#--------------------------------------------------------#

      - name: 下载源代码
        uses: actions/checkout@v3
 
      - name: 编译
        run: |
          cmake -S . -B build_dir -G "Ninja Multi-Config"
          cmake --build build_dir --config Release