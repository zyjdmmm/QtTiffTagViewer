name: TagView-CI-MinGW
 
on: [push]


env:
  QT_VERSION: 6.5.3

jobs:
  build:
    name: "Build"
    runs-on: windows-latest

    steps:
      - name: 安装 ninja
        run: choco install ninja


      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qt5compat'
          # 一定要按照qt本版本自带的编译器tools_mingw1310中的gcc.exe
          tools: 'tools_mingw1310 tools_ninja tools_cmake'

      - name: 下载项目代码
        uses: actions/checkout@v4
  
 #--------------------------------------------------------#
      - name: 打印用户环境变量PATH1
        run: | 
          Write-Host "`n=== User PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "User") -split ';' | ForEach-Object { Write-Host $_ }

      - name: 打印系统环境变量PATH1
        run: |
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' | ForEach-Object { Write-Host $_ }
#--------------------------------------------------------#

      - name: 移除 C 盘 MinGW 路径(我发现只能这样去掉C:\mingw64\bin，没找到其他的好方法)
        shell: pwsh
        run: |
          # 1. 拆分 PATH 并过滤掉 C 盘的 MinGW 路径
          $filtered_path = $env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\mingw64\bin' -and $_ -ne 'C:\Program Files\Git\mingw64\bin'
          }
          # 2. 重新拼接 PATH 并持久化到后续步骤
          $env:PATH = $filtered_path -join ';'
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append


      #这个看似最简单的添加环境变量是无效的❌️
      # - name: Set up environment
      #   shell: pwsh
      #   run: |
      #     # 1. 把 Qt 的路径追加到现有的 PATH 最前面（优先使用）
      #     $env:PATH = "D:\a\QtTiffTagViewer\Qt\6.5.3\mingw_64\bin;$env:PATH"
        

#--------------------------------------------------------#
      - name: 打印用户环境变量PATH2
        run: | 
          Write-Host "`n=== User PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "User") -split ';' | ForEach-Object { Write-Host $_ }

      - name: 打印系统环境变量PATH2
        run: |
          Write-Host "=== System PATH ==="
          [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' | ForEach-Object { Write-Host $_ }
#--------------------------------------------------------#

      - name: 另一种打印变量方法
        shell: pwsh
        run: |
          Write-Host "===== Qt Environment Variables ====="
          Write-Host "QT_ROOT_DIR: $env:QT_ROOT_DIR"
          Write-Host "IQTA_TOOLS: $env:IQTA_TOOLS"
          Write-Host "PATH (full): $env:PATH"


      - name: 编译
        run: |
          cmake -B ./build -DCMAKE_BUILD_TYPE=Debug -G Ninja
          cmake --build ./build
